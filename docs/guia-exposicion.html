(function () {
'use strict';

/* ---------- utilidades ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag), i, k, c;
  if (attrs) for (k in attrs) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  for (i = 2; i < arguments.length; i++) {
    c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(function (x) { if (x) el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}
/* texto con `codigo` en línea */
function rich(s) {
  var parts = String(s).split('`'), out = [];
  parts.forEach(function (p, i) { if (p) out.push(i % 2 ? h('code', { text: p }) : p); });
  return out;
}
function parse(src) {
  var blocks = [], cur = null;
  src.replace(/^\n/, '').replace(/\n$/, '').split('\n').forEach(function (l) {
    if (l.slice(0, 2) === '@@') {
      var sp = l.slice(2).trim().split(' ');
      cur = { k: sp.shift(), title: sp.join(' '), lines: [] }; blocks.push(cur);
    } else {
      var i = l.indexOf(' ¦ ');
      cur.lines.push(i < 0 ? [l, ''] : [l.slice(0, i).replace(/\s+$/, ''), l.slice(i + 3)]);
    }
  });
  return blocks;
}
function statusChip(code) { return h('span', { class: 'st ' + (code < 300 ? 's2' : 's4'), text: String(code) }); }

var FILES = [
{ id: 'props', g: 'Configuración', name: 'application.properties', path: 'src/main/resources/', intro: 'Configuración de la aplicación. Los secretos no están aquí: se leen del archivo .env, que no se sube a git.', src: `
@@all Propiedades
spring.config.import=optional:file:.env[.properties] ¦ Lee el archivo .env como si fuera otro archivo de propiedades. Por eso DB_PASSWORD y JWT_SECRET no aparecen en el repositorio.
spring.datasource.url=\${DB_URL} ¦ Dirección de PostgreSQL (Neon). El valor real viene de .env.
spring.datasource.username=\${DB_USERNAME}
spring.datasource.password=\${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate ¦ Hibernate no crea ni cambia tablas: solo comprueba que coinciden con las entidades. Las tablas las crea Flyway. Si algo no coincide, la aplicación no arranca.
spring.jpa.open-in-view=false ¦ La conexión a la base se suelta al terminar el servicio. Obliga a convertir a DTO dentro de la transacción y evita consultas escondidas al escribir el JSON.
spring.data.web.pageable.max-page-size=100 ¦ Tope del parámetro size. Sin tope, alguien pediría size=1000000 y tumbaría el servidor.
jwt.secret=\${JWT_SECRET} ¦ Clave con la que se firman los tokens. Mínimo 32 bytes para HS256.
jwt.expiration=60m ¦ Duración del token. Se cambia sin tocar código.
` },
{ id: 'jwtprops', g: 'Seguridad (JWT)', name: 'JwtProperties.java', path: 'security/', intro: 'Agrupa las propiedades jwt.* en un objeto con tipos.', src: `
@@all JwtProperties
@ConfigurationProperties(prefix = "jwt") ¦ Le dice a Spring: toma las propiedades que empiezan con jwt. y mételas en este objeto. Así la clave y la duración no están escritas en el código.
public record JwtProperties(String secret, Duration expiration) { ¦ Un record es una clase inmutable de solo datos. secret recibe jwt.secret y expiration recibe jwt.expiration (Spring convierte 60m a Duration).
}
` },
{ id: 'jwtservice', g: 'Seguridad (JWT)', name: 'JwtService.java', path: 'security/', intro: 'El único lugar que sabe crear y verificar tokens. Usa la librería JJWT 0.12.', src: `
@@ctor Constructor: preparar la clave
@Service ¦ Spring crea un solo objeto de esta clase y lo inyecta donde se pida.
public class JwtService {
    private final SecretKey key;
    private final Duration expiration;

    public JwtService(JwtProperties properties) { ¦ Inyección por constructor: recibe la configuración ya leída.
        this.key = Keys.hmacShaKeyFor(properties.secret().getBytes(StandardCharsets.UTF_8)); ¦ Convierte el texto de JWT_SECRET en una clave HMAC. Si tiene menos de 32 bytes lanza WeakKeyException y la aplicación no arranca.
        this.expiration = properties.expiration();
    }
@@generate generateToken: crear el token
    public String generateToken(String username) {
        Instant now = Instant.now();
        return Jwts.builder()
                .subject(username) ¦ Campo sub: el dueño del token. Solo el username, no los roles: los roles se leen de la base en cada petición, así un cambio de rol aplica de inmediato.
                .issuedAt(Date.from(now)) ¦ Campo iat: cuándo se emitió.
                .expiration(Date.from(now.plus(expiration))) ¦ Campo exp: cuándo vence (ahora + 60 minutos).
                .signWith(key, Jwts.SIG.HS256) ¦ Firma el contenido con la clave secreta. Si alguien cambia el contenido, la firma ya no coincide.
                .compact(); ¦ Devuelve el texto final: cabecera.contenido.firma
    }
@@extract extractUsername: verificar el token
    public String extractUsername(String token) {
        return Jwts.parser()
                .verifyWith(key) ¦ Con qué clave se comprueba la firma.
                .build()
                .parseSignedClaims(token) ¦ Aquí ocurre la verificación. Lanza JwtException si la firma no coincide, el token venció o está mal formado.
                .getPayload()
                .getSubject(); ¦ Si todo está bien, devuelve el username guardado en sub.
    }
}
` },
{ id: 'uds', g: 'Seguridad (JWT)', name: 'CustomUserDetailsService.java', path: 'security/', intro: 'Aquí se cumple "usuarios manejados desde base de datos": enseña a Spring Security a buscar un usuario en la tabla users.', src: `
@@all loadUserByUsername
@Service
public class CustomUserDetailsService implements UserDetailsService { ¦ UserDetailsService es la interfaz que Spring Security usa para buscar usuarios. Spring no conoce nuestra tabla: esta clase se la presenta.
    @Override
    @Transactional(readOnly = true) ¦ Mantiene la conexión abierta mientras dura el método. Sin esto, leer los roles (relación LAZY) fallaría con LazyInitializationException.
    public UserDetails loadUserByUsername(String username) throws UsernameNotFoundException {
        User user = userRepository.findByUsername(username) ¦ SELECT en la tabla users por username.
                .orElseThrow(() -> new UsernameNotFoundException("No existe el usuario " + username)); ¦ Si no existe, el filtro lo trata como anónimo y el login responde 401.

        List<SimpleGrantedAuthority> authorities = user.getRoles().stream() ¦ Lee los roles desde user_roles y roles.
                .map(role -> new SimpleGrantedAuthority(role.getName())) ¦ Convierte cada rol (ROLE_ADMIN, ROLE_USER) al formato que entiende Spring Security.
                .toList();

        return org.springframework.security.core.userdetails.User ¦ Nombre completo porque se llama igual que nuestra entidad User.
                .withUsername(user.getUsername())
                .password(user.getPasswordHash()) ¦ Entrega el hash BCrypt; en el login Spring lo compara con la contraseña enviada.
                .authorities(authorities) ¦ Con estos roles funciona luego hasRole('ADMIN').
                .build();
    }
}
` },
{ id: 'filter', g: 'Seguridad (JWT)', name: 'JwtAuthenticationFilter.java', path: 'security/', intro: 'Se ejecuta antes que cualquier controlador, una vez por petición. Solo identifica al usuario: no decide permisos.', src: `
@@class Clase
@Component ¦ Spring lo crea y SecurityConfig lo coloca en la cadena de filtros.
public class JwtAuthenticationFilter extends OncePerRequestFilter { ¦ OncePerRequestFilter garantiza que corre exactamente una vez por petición.
    private static final String BEARER_PREFIX = "Bearer "; ¦ El estándar para enviar tokens: Authorization: Bearer <token>
@@header Leer la cabecera
    protected void doFilterInternal(HttpServletRequest request, HttpServletResponse response,
            FilterChain filterChain) throws ServletException, IOException {
        String header = request.getHeader(HttpHeaders.AUTHORIZATION); ¦ Lee la cabecera Authorization de la petición.
        if (header != null && header.startsWith(BEARER_PREFIX)) { ¦ Solo actúa si hay cabecera y empieza con "Bearer ". Si no, salta directo al final: la petición sigue como anónima.
            String token = header.substring(BEARER_PREFIX.length()); ¦ Quita el prefijo y se queda con el token.
@@verify Verificar y autenticar
            try {
                String username = jwtService.extractUsername(token); ¦ Verifica firma y vencimiento; devuelve el dueño del token.
                UserDetails userDetails = userDetailsService.loadUserByUsername(username); ¦ Trae de la base al usuario con sus roles actuales.
                UsernamePasswordAuthenticationToken authentication =
                        UsernamePasswordAuthenticationToken.authenticated(
                                userDetails, null, userDetails.getAuthorities()); ¦ Crea el objeto "usuario ya autenticado" con sus roles. El null es la contraseña: no hace falta, el token ya probó quién es.
                SecurityContextHolder.getContext().setAuthentication(authentication); ¦ Lo guarda en el contexto de seguridad de esta petición. De aquí lo leen las reglas, @PreAuthorize y el parámetro Authentication del controlador.
@@catch Token inválido
            } catch (JwtException | IllegalArgumentException | UsernameNotFoundException e) { ¦ Token falso, vencido, mal formado o de un usuario borrado.
                // la petición sigue como anónima ¦ No responde error aquí: el filtro solo identifica. Las reglas de seguridad responderán 401.
            }
        }
@@next Continuar la cadena
        filterChain.doFilter(request, response); ¦ Siempre se llama: deja pasar la petición al siguiente filtro. Quien decide si entra son las reglas de SecurityConfig.
    }
}
` },
{ id: 'seccfg', g: 'Seguridad (JWT)', name: 'SecurityConfig.java', path: 'security/', intro: 'Las reglas: qué rutas son públicas, qué pasa sin token y cómo se guardan las contraseñas.', src: `
@@ann Anotaciones
@Configuration
@EnableMethodSecurity ¦ Activa @PreAuthorize. Sin esta línea, @PreAuthorize se ignora en silencio y cualquiera podría cambiar estados.
@EnableConfigurationProperties(JwtProperties.class) ¦ Registra JwtProperties para que reciba jwt.secret y jwt.expiration.
public class SecurityConfig {
@@chain Cadena de filtros y reglas
    @Bean
    public SecurityFilterChain securityFilterChain(HttpSecurity http, JwtAuthenticationFilter jwtFilter)
            throws Exception {
        http
                .csrf(csrf -> csrf.disable()) ¦ CSRF protege aplicaciones que usan cookies de sesión. Aquí no hay cookies: cada petición lleva su token, así que no aplica.
                .sessionManagement(session -> session.sessionCreationPolicy(SessionCreationPolicy.STATELESS)) ¦ No se crean sesiones en el servidor. Cada petición se identifica sola con su token.
                .authorizeHttpRequests(rules -> rules
                        .requestMatchers(ApiPaths.V1 + "/auth/login", "/error").permitAll() ¦ Rutas públicas: nadie tiene token antes de iniciar sesión.
                        .anyRequest().authenticated()) ¦ Todo lo demás exige estar autenticado. Una ruta nueva nace protegida por defecto.
                .exceptionHandling(errors -> errors
                        .authenticationEntryPoint(new HttpStatusEntryPoint(HttpStatus.UNAUTHORIZED))) ¦ Si no hay autenticación, responde 401 (por defecto Spring respondería 403). 401 = no sé quién eres.
                .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class); ¦ Coloca nuestro filtro JWT antes del filtro de login estándar, para que el usuario ya esté identificado cuando se evalúan las reglas.
        return http.build();
    }

@@class Clase
@Service
@Transactional(readOnly = true) ¦ Por defecto, transacción de solo lectura en cada método.
public class TicketService {
    private static final Set<String> SORTABLE_FIELDS = Set.of("createdAt", "updatedAt", "title", "status"); ¦ Lista blanca: los únicos atributos por los que el cliente puede ordenar.
@@list findAll
    public PageResponse<TicketResponse> findAll(TicketStatus status, Pageable pageable) {
        validateSort(pageable); ¦ Primero revisa que el orden pedido esté permitido.
        Page<Ticket> tickets = (status == null)
                ? ticketRepository.findAll(pageable) ¦ Sin filtro: todos los tickets de esa página.
                : ticketRepository.findByStatus(status, pageable); ¦ Con filtro: solo los de ese estado.
        return PageResponse.from(tickets.map(TicketResponse::from)); ¦ Convierte cada ticket a DTO conservando los datos de la página (número, tamaño, total).
    }
@@get findById
    public TicketResponse findById(Long id) {
        return TicketResponse.from(findTicket(id)); ¦ Busca y convierte a DTO dentro de la transacción.
    }
@@create create
    @Transactional ¦ Escribe: si algo falla, no queda nada a medias.
    public TicketResponse create(TicketRequest request, String username) {
        Category category = categoryRepository.findById(request.categoryId())
                .orElseThrow(() -> new InvalidRequestException("No existe la categoría " + request.categoryId())); ¦ El JSON era válido de forma, pero el categoryId no existe: 400.
        User creator = userRepository.findByUsername(username)
                .orElseThrow(() -> new ResourceNotFoundException("No existe el usuario " + username)); ¦ El dueño del token, buscado en la base.
        Ticket ticket = new Ticket(
                request.title(), request.description(), request.priority(), category, creator); ¦ El constructor fija el estado OPEN: el cliente no decide eso.
        return TicketResponse.from(ticketRepository.save(ticket)); ¦ INSERT. Hibernate pone version en 0 y la auditoría llena las fechas.
    }
@@status changeStatus
    @Transactional
    public TicketResponse changeStatus(Long id, ChangeStatusRequest request) {
        Ticket ticket = findTicket(id); ¦ Si no existe: 404.
        if (!Objects.equals(ticket.getVersion(), request.version())) { ¦ Primera defensa del bloqueo optimista: ¿la versión que envió el cliente sigue siendo la actual?
            throw new ConflictException("El ticket " + id
                    + " fue modificado por otra persona. Vuelve a cargarlo e inténtalo de nuevo"); ¦ No coincide: otra persona lo cambió después de que este cliente lo leyó. 409.
        }
        ticket.changeStatus(request.status()); ¦ Método con nombre de negocio en la entidad, no un setter.
        return TicketResponse.from(ticketRepository.saveAndFlush(ticket)); ¦ saveAndFlush envía el UPDATE ahora mismo, así la respuesta ya trae la versión y la fecha nuevas. Segunda defensa: el UPDATE lleva WHERE version = ?.
    }
@@find findTicket
    private Ticket findTicket(Long id) {
        return ticketRepository.findById(id)
                .orElseThrow(() -> new ResourceNotFoundException("No existe el ticket " + id)); ¦ Optional vacío se convierte en excepción del dominio; el manejador global la traduce a 404.
    }
@@sort validateSort
    private void validateSort(Pageable pageable) {
        for (Sort.Order order : pageable.getSort()) { ¦ Recorre cada atributo de ?sort=
            if (!SORTABLE_FIELDS.contains(order.getProperty())) {
                throw new InvalidRequestException("No se puede ordenar por " + order.getProperty()); ¦ El parámetro sort viene del cliente. Sin este filtro, un nombre mal escrito causaría un 500 o se ordenaría por columnas sin índice.
            }
        }
    }
}
` },

@@fields Columnas
@Entity
@Table(name = "tickets") ¦ Esta clase corresponde a la tabla tickets.
public class Ticket extends AuditableEntity { ¦ Hereda created_at y updated_at automáticos.
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY) ¦ El id lo genera la base (columna IDENTITY).
    private Long id;
    @Column(nullable = false, length = 150)
    private String title;
    @Enumerated(EnumType.STRING) ¦ Guarda el nombre ('OPEN'), no la posición. Con ORDINAL, insertar un estado en medio cambiaría el significado de los números guardados.
    @Column(nullable = false, length = 20)
    private TicketStatus status;
@@rel Relaciones
    @ManyToOne(fetch = FetchType.LAZY, optional = false) ¦ Muchos tickets, una categoría. LAZY: solo se trae de la base cuando se usa (o cuando @EntityGraph lo pide).
    @JoinColumn(name = "category_id", nullable = false) ¦ La clave foránea en la tabla.
    private Category category;
    @ManyToOne(fetch = FetchType.LAZY, optional = false)
    @JoinColumn(name = "creator_id", nullable = false, updatable = false) ¦ updatable = false: el creador de un ticket no cambia nunca.
    private User creator;
@@version Bloqueo optimista
    @Version ¦ Hibernate suma 1 en cada UPDATE y agrega WHERE version = ?. Si otro ya la cambió, el UPDATE no encuentra la fila y se lanza una excepción que termina en 409.
    @Column(nullable = false)
    private Long version;
@@ctor Constructor y cambio de estado
    protected Ticket() { } ¦ JPA exige un constructor vacío; protected para que nadie más lo use.
    public Ticket(String title, String description, Priority priority, Category category, User creator) {
        ... ¦ Un ticket nace completo: no hay setters.
        this.status = TicketStatus.OPEN; ¦ Todo ticket nace OPEN.
    }
    public void changeStatus(TicketStatus newStatus) { ¦ Método con nombre de negocio. Aquí vivirán las reglas de la Fase 2 (por ejemplo, no reabrir un ticket cerrado).
        this.status = newStatus;
    }
@@audit AuditableEntity
@MappedSuperclass ¦ No es una tabla: sus columnas se copian a cada entidad que la extiende.
@EntityListeners(AuditingEntityListener.class) ¦ Spring Data escucha cada INSERT y UPDATE.
public abstract class AuditableEntity {
    @CreatedDate ¦ Se llena una sola vez, al insertar.
    @Column(name = "created_at", nullable = false, updatable = false)
    private Instant createdAt;
    @LastModifiedDate ¦ Se actualiza en cada cambio. Nadie puede olvidarse de hacerlo a mano.
    @Column(name = "updated_at", nullable = false)
    private Instant updatedAt;
}

@@domain Excepciones del dominio
@RestControllerAdvice ¦ Atiende las excepciones de todos los controladores.
public class GlobalExceptionHandler extends ResponseEntityExceptionHandler { ¦ La clase base ya convierte los errores propios de Spring (JSON mal formado, enum desconocido) en 400.
    @ExceptionHandler(ResourceNotFoundException.class)
    public ProblemDetail handleNotFound(ResourceNotFoundException e) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage()); ¦ 404. ProblemDetail es el formato estándar de errores HTTP (RFC 9457): status, title, detail, instance.
    }
    @ExceptionHandler({DuplicateResourceException.class, ConflictException.class})
    public ProblemDetail handleConflict(RuntimeException e) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, e.getMessage()); ¦ 409: ya existe, o cambió desde que se leyó.
    }
    @ExceptionHandler(InvalidRequestException.class)
    public ProblemDetail handleInvalidRequest(InvalidRequestException e) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.BAD_REQUEST, e.getMessage()); ¦ 400: datos válidos de forma pero no de fondo.
    }
@@lock Choque simultáneo
    @ExceptionHandler(ObjectOptimisticLockingFailureException.class) ¦ La lanza Hibernate cuando el UPDATE ... WHERE version = ? no encuentra la fila: dos peticiones en el mismo instante.
    public ProblemDetail handleOptimisticLock(ObjectOptimisticLockingFailureException e) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT,
                "El recurso fue modificado por otra persona. Vuelve a cargarlo e inténtalo de nuevo");
    }
@@creds Login incorrecto
    @ExceptionHandler(BadCredentialsException.class)
    public ProblemDetail handleBadCredentials(BadCredentialsException e) {
        return ProblemDetail.forStatusAndDetail(HttpStatus.UNAUTHORIZED, "Usuario o contraseña incorrectos"); ¦ Mismo mensaje si el usuario no existe o si la contraseña es incorrecta: no se revela cuál de los dos falló.
    }
@@valid Errores de @Valid
    @Override
    protected ResponseEntity<Object> handleMethodArgumentNotValid(MethodArgumentNotValidException ex, ...) {
        Map<String, String> errors = new LinkedHashMap<>();
        for (FieldError error : ex.getBindingResult().getFieldErrors()) {
            errors.putIfAbsent(error.getField(), error.getDefaultMessage()); ¦ Junta qué campo falló y por qué.
        }
        ProblemDetail problem = ex.getBody();
        problem.setDetail("Hay campos inválidos");
        problem.setProperty("errors", errors); ¦ Agrega "errors" al JSON: el cliente sabe exactamente qué corregir.
        return handleExceptionInternal(ex, problem, headers, status, request);
    }
}

var QA = [
['¿Cuál es la diferencia entre 401 y 403?', '401 es "no sé quién eres": no hay token, es falso o venció. Lo responde `SecurityConfig` con `HttpStatusEntryPoint`. 403 es "sé quién eres, pero no tienes permiso": el token es válido y el rol no alcanza. Lo provoca `@PreAuthorize("hasRole(\'ADMIN\')")`.'],
['¿Dónde se ve que los usuarios se manejan desde base de datos?', 'En las tablas `users`, `roles` y `user_roles` (migración V1) y en `CustomUserDetailsService`, que busca al usuario con `userRepository.findByUsername` en cada login y en cada petición con token. Además `POST /users` crea usuarios nuevos en la base.'],
['¿Qué contiene el token y por qué no lleva los roles?', 'Tres datos: `sub` (el username), `iat` (cuándo se emitió) y `exp` (cuándo vence), más la firma HS256. El contenido no está cifrado, solo codificado, por eso nunca se guarda ahí una contraseña. Los roles se leen de la base en cada petición: si le quitas un rol a alguien, aplica de inmediato y no cuando venza su token.'],
['¿Qué pasa si alguien modifica el token?', 'La firma se calcula con el contenido y con `JWT_SECRET`. Si cambia una letra del contenido, la firma ya no coincide, `parseSignedClaims` lanza `JwtException`, el filtro la atrapa y la petición sigue como anónima: 401.'],
['¿Por qué BCrypt para las contraseñas?', 'Guarda un hash, no la contraseña. Es lento a propósito y usa una sal distinta por contraseña, así que dos usuarios con la misma clave tienen hashes distintos y un ataque por fuerza bruta es muy caro. `UserResponse` no tiene campo de contraseña, así que es imposible que el hash salga en una respuesta.'],
['¿Por qué desactivan CSRF y las sesiones?', 'CSRF ataca aplicaciones que se identifican con cookies que el navegador envía solo. Esta API no usa cookies: cada petición lleva su token en una cabecera. Por lo mismo es `STATELESS`: el servidor no guarda sesiones.'],
['¿Por qué la página empieza en 0 y no en 1?', 'Es la convención de Spring Data: `Pageable` trata la página como un índice, porque el salto en SQL es `OFFSET = page × size`. La página 0 salta 0 filas. Se puede cambiar con `spring.data.web.pageable.one-indexed-parameters=true`, pero mantuvimos el estándar del framework.'],
['¿Por qué DTO y no devolver las entidades?', 'Cuatro razones: `UserResponse` no expone el hash; `TicketRequest` solo acepta lo que el cliente puede decidir (no status, creator ni version); se puede cambiar una tabla sin cambiar el JSON; y una entidad serializada fuera de la transacción falla al tocar una relación LAZY.'],
['¿Qué es el bloqueo optimista y cómo lo implementaron?', 'Evita que dos administradores se pisen. El ticket tiene una columna `version` con `@Version`. El cliente recibe la versión al leer y la devuelve al modificar. Hay dos defensas: el servicio compara las versiones (caso lento) y Hibernate agrega `WHERE version = ?` al UPDATE (caso simultáneo). Las dos terminan en 409. Se llama optimista porque no bloquea la fila: supone que los choques son raros.'],
['¿Por qué saveAndFlush y no save?', 'Con `save`, Hibernate enviaría el UPDATE al terminar la transacción, después de armar la respuesta, y el JSON saldría con la versión vieja. `saveAndFlush` lo envía en ese momento, así la respuesta ya trae la versión y la fecha nuevas.'],
['¿Qué es @EntityGraph y el problema N+1?', 'Las relaciones son LAZY. Sin `@EntityGraph`, listar 20 tickets haría 1 consulta para los tickets y hasta 40 más para la categoría y el creador de cada uno. `@EntityGraph` los trae con un JOIN en la misma consulta.'],
['¿Qué hace @Transactional?', 'Sobre la clase con `readOnly = true`: cada método corre en una transacción de solo lectura. Sobre un método que escribe: si lanza una excepción, todo lo que hizo se deshace. También mantiene la conexión abierta para leer relaciones LAZY y convertir a DTO.'],
['¿Por qué una capa de servicios?', 'El controlador solo traduce HTTP y el repositorio solo habla con la base. Las reglas del negocio viven en un lugar, con una transacción por operación, y se pueden probar sin levantar Spring (pruebas unitarias con Mockito).'],
['¿Por qué Flyway y ddl-auto=validate?', 'Flyway aplica scripts SQL numerados una sola vez por base y anota cuáles ejecutó en `flyway_schema_history`. El esquema queda versionado en git. Hibernate no toca las tablas: con `validate` solo comprueba que coinciden con las entidades y, si no, la aplicación no arranca.'],
['¿Por qué una lista blanca para ordenar?', 'El parámetro `sort` viene del cliente. Sin `SORTABLE_FIELDS`, un nombre mal escrito causaría un 500 y alguien podría ordenar por columnas sin índice o que no debe conocer, como `passwordHash`.'],
['¿Por qué a veces el 400 dice "Failed to read request" y otras lista los campos?', 'Son dos momentos distintos. Si el JSON está mal formado o trae un enum desconocido, Jackson no puede crear el objeto y Spring responde el mensaje genérico. Si el objeto se crea pero un campo no cumple `@NotBlank` o `@Size`, falla `@Valid` y nuestro manejador agrega `errors` con cada campo.'],
['¿Por qué el creador del ticket no viene en el JSON?', 'Porque el cliente podría mentir. El controlador toma el username del objeto `Authentication` que el filtro JWT dejó en el contexto: un ticket siempre queda a nombre del dueño del token.'],
['¿Por qué no hay un @ExceptionHandler(Exception.class)?', 'Atraparía también el `AccessDeniedException` de `@PreAuthorize` y convertiría los 403 en 500.'],
['¿Qué diferencia hay entre sus pruebas unitarias y de integración?', 'Las 9 unitarias prueban un servicio aislado con repositorios simulados por Mockito, sin levantar Spring: tardan milisegundos. Las 21 de integración levantan la aplicación completa con MockMvc y una base H2 en memoria: la petición pasa por el filtro, el controlador, el servicio y la base. Cada servicio REST tiene al menos 2 casos con entrada, salida esperada y verificación.'],
['¿Por qué /api/v1 en las rutas?', 'Versionar permite publicar `/api/v2` con un JSON distinto sin romper a los clientes que ya usan `/api/v1`. El prefijo está en una constante (`ApiPaths.V1`) que usan los controladores y las reglas de seguridad.']
];

  return h('section', { class: 'tab' },
    h('h2', { text: 'Preguntas que puede hacer el profesor' }),
    h('p', { class: 'lead', text: 'Responde en voz alta antes de abrir cada una.' }),
    h('div', { class: 'steps' }, QA.map(function (q) {
      return h('details', { class: 'q' }, h('summary', { text: q[0] }), h('div', null, rich(q[1])));
    }))
  );
}

function copy(text, btn) {
  var done = function () { btn.textContent = 'Copiado'; setTimeout(function () { btn.textContent = 'Copiar'; }, 1400); };
  try { navigator.clipboard.writeText(text).then(done, function () { btn.textContent = 'Selecciona y copia'; }); }
  catch (e) { btn.textContent = 'Selecciona y copia'; }
}
function viewDemo() {
  return h('section', { class: 'tab' },
    h('h2', { text: 'Guion de la demostración' }),
    h('div', { class: 'card' }, h('h3', { text: 'Antes de empezar' }), h('ul', { class: 'clean' },
      h('li', null, rich('Arranca con `./gradlew bootRun`, no con el botón Run del IDE. El IDE compila sin el flag `-parameters` y las rutas con `{id}` o `?status=` responden 500.')),
      h('li', null, rich('Los tokens duran 60 minutos: vuelve a hacer login justo antes de exponer.')),
      h('li', null, rich('El bloqueo optimista depende de la versión actual del ticket. Usa un ticket recién creado (versión 0) o lee su versión con `GET /tickets/{id}` antes del `PUT`.')),
      h('li', null, rich('Ten abierto el informe de pruebas (`build/reports/tests/test/index.html`) por si falla la red.')),
      h('li', null, rich('Los ids cambian según lo que ya exista en la base: ajusta el `1` de los comandos.')))),
    h('div', { class: 'steps' }, DEMO.map(function (d, i) {
      var btn = h('button', { class: 'btn' }, 'Copiar');
      btn.addEventListener('click', function () { copy(d[1], btn); });
      var code = parseInt(d[2], 10);
      return h('div', { class: 'card cmd' },
        h('div', { class: 'hd' }, h('h3', { text: (i + 1) + '. ' + d[0] }),
          h('span', { class: 'ctrl' }, d[2] ? (code ? statusChip(code) : h('span', { class: 'chip', text: d[2] })) : null, btn)),
        h('pre', { class: 'raw', text: d[1] }));
    }))
  );
}

var TABS = [['rubrica', 'Rúbrica', viewRubrica], ['flujo', 'Flujo de una petición', viewFlujo], ['codigo', 'Código línea por línea', viewCodigo], ['pruebas', 'Pruebas', viewPruebas], ['preguntas', 'Preguntas', viewPreguntas], ['demo', 'Demo', viewDemo]];
function render() {
  var tabs = document.getElementById('tabs');
  tabs.textContent = '';
  TABS.forEach(function (t) {
    tabs.appendChild(h('button', { role: 'tab', 'aria-selected': String(t[0] === state.tab), onclick: function () {
      state.tab = t[0]; try { history.replaceState(null, '', '#' + t[0]); } catch (e) {} render(); window.scrollTo(0, 0);
    } }, t[1]));
  });
  var view = TABS.filter(function (t) { return t[0] === state.tab; })[0][2];
  main.textContent = '';
  main.appendChild(view());
}
document.addEventListener('keydown', function (e) {
  if (state.tab !== 'flujo') return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'ArrowLeft') move(-1);
});
var hash = (location.hash || '').slice(1);
if (TABS.some(function (t) { return t[0] === hash; })) state.tab = hash;
render();
})();
</script>
