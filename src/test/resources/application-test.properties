# Perfil "test": estos valores PISAN a los de application.properties mientras corren las pruebas

# Base de datos H2 en memoria: nace vacía y desaparece al terminar
spring.datasource.url=jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Las migraciones usan SQL propio de PostgreSQL (pgcrypto): en H2 no se ejecutan
spring.flyway.enabled=false

# En su lugar, Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop

# Clave fija y pública: solo sirve para las pruebas
jwt.secret=clave_solo_para_pruebas_no_protege_nada_0123456789
