spring.application.name=tickets

# Lee el archivo .env (si existe) como si fuera otro archivo de propiedades
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL: los valores reales viven en .env, no aquí
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea y cambia las tablas; Hibernate solo comprueba que coinciden con las entidades
spring.jpa.hibernate.ddl-auto=validate

# La conexión a la base se suelta al terminar el servicio, no al terminar la petición
spring.jpa.open-in-view=false

# Paginación: nadie puede pedir más de 100 elementos por página
spring.data.web.pageable.max-page-size=100

# Tokens: clave de firma y duración
jwt.secret=${JWT_SECRET}
jwt.expiration=60m