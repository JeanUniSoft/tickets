<section class="tarjeta angosta">
  <h1>Iniciar sesión</h1>
  <form #miForm="ngForm" (ngSubmit)="onIngresar(miForm)">
    <div class="campo">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" ngModel required #username="ngModel">
      <div class="error" *ngIf="username.invalid && username.touched">
        <div *ngIf="username.errors?.['required']">Usuario es obligatorio</div>
      </div>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" ngModel required #password="ngModel">
      <div class="error" *ngIf="password.invalid && password.touched">
        <div *ngIf="password.errors?.['required']">Contraseña es obligatoria</div>
      </div>
    </div>
    <button type="submit" [disabled]="miForm.invalid">Ingresar</button>
  </form>
  <p class="aviso malo" *ngIf="error()">{{ error() }}</p>
</section>
